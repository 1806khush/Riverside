<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPE Studio AI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>CPE Studio <span>AI</span></h1>
  <nav>
    <button data-view="record" class="active">Record</button>
    <button data-view="library">Recordings</button>
  </nav>
</header>

<div id="toast" class="toast hidden"></div>

<main>
  <!-- ============ RECORD ============ -->
  <section id="view-record" class="view">
    <input id="title" class="title-input" placeholder="Lecture title, e.g. CPE 595 - Week 3, Part A">

    <div class="previews">
      <div class="tile">
        <video id="camPreview" muted autoplay playsinline></video>
        <div id="camOff" class="placeholder hidden">Camera is off</div>
        <div id="noCam" class="placeholder">Waiting for camera...</div>
      </div>
      <div class="tile">
        <video id="screenPreview" muted autoplay playsinline></video>
        <div id="noScreen" class="placeholder">No screen shared</div>
      </div>
    </div>

    <div class="levels">
      <div><span class="small muted">Microphone</span><div class="meter"><div id="meterBar"></div></div></div>
      <div><span id="scrLabel" class="small muted">Screen audio</span><div class="meter"><div id="scrBar"></div></div></div>
    </div>

    <div class="bar">
      <button id="btnCamToggle" class="toggle on" disabled>Camera: On</button>
      <button id="btnMicToggle" class="toggle on" disabled>Microphone: On</button>
      <button id="btnScreen" disabled>Share screen</button>
      <button id="btnStopScreen" class="hidden">Stop sharing</button>
      <button id="btnEnable" class="primary hidden">Retry camera</button>
    </div>

    <div class="controls">
      <button id="btnStart" class="rec" disabled>&#9679; Start recording</button>
      <button id="btnPause" disabled>Pause</button>
      <button id="btnStop" disabled>Stop &amp; save</button>
      <span id="timer" class="timer">00:00</span>
      <span id="recBadge" class="badge hidden">REC</span>
    </div>

    <div id="captions" class="captions muted">Live captions appear here while recording.</div>

    <details class="plain">
      <summary>Device settings</summary>
      <label>Camera<select id="camSel"></select></label>
      <label>Microphone<select id="micSel"></select></label>
    </details>
  </section>

  <!-- ============ RECORDINGS ============ -->
  <section id="view-library" class="view hidden">
    <h2>Recordings</h2>
    <ul id="sessionList" class="list"></ul>
  </section>

  <!-- ============ REVIEW ============ -->
  <section id="view-review" class="view hidden">
    <div class="review-head">
      <div>
        <h2 id="rvTitle"></h2>
        <div id="rvMeta" class="muted small"></div>
      </div>
      <div id="layouts" class="layouts">
        <button data-layout="cam">Camera</button>
        <button data-layout="screen" class="active">Slides</button>
      </div>
    </div>
    <div id="rvWarn" class="warn hidden"></div>

    <div class="review-grid">
      <div>
        <div id="viewer" class="viewer layout-screen">
          <video id="rvScreen" playsinline></video>
          <video id="rvCam" playsinline></video>
        </div>
        <div class="transport">
          <button id="tpPlay">&#9654;</button>
          <input type="range" id="tpSeek" min="0" max="1000" value="0">
          <span id="tpTime" class="muted small">00:00 / 00:00</span>
        </div>
        <div class="row">
          <button id="btnDownloadAll" class="primary">Download everything</button>
        </div>
        <details class="plain">
          <summary>Download individual files</summary>
          <div class="exports">
            <button data-dl="camera">Camera + mic</button>
            <button data-dl="screen">Screen / slides</button>
            <button data-dl="mic">Audio only</button>
            <button data-dl="srt">Transcript .srt</button>
            <button data-dl="txt">Transcript .txt</button>
            <button data-dl="json">Transcript .json</button>
            <button data-dl="manifest">Manifest</button>
          </div>
        </details>
      </div>

      <div class="panel transcript-panel">
        <h3>Transcript</h3>
        <label>API key (Groq or OpenAI)
          <input id="apiKey" type="password" placeholder="Paste key once" autocomplete="off">
        </label>
        <details class="plain">
          <summary>Advanced</summary>
          <label>Provider
            <select id="provider">
              <option value="groq">Groq (whisper-large-v3-turbo)</option>
              <option value="openai">OpenAI (whisper-1)</option>
              <option value="custom">Custom OpenAI-compatible</option>
            </select>
          </label>
          <label>Base URL<input id="baseUrl"></label>
          <label>Model<input id="model"></label>
        </details>
        <div class="row">
          <button id="btnTranscribe" class="primary">Generate transcript</button>
          <button id="btnUseCaps" class="hidden">Use live captions instead</button>
        </div>
        <div id="trStatus" class="muted small"></div>
        <div id="transcript" class="transcript"></div>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
